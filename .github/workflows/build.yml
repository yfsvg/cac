name: Build

# for other pals, run this manually from actions tab / automatically push github release for every v* tag
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: FocusGuard-windows
            file: dist/FocusGuard.exe
          - os: macos-latest # Apple Silicon
            artifact: FocusGuard-macos
            file: dist/FocusGuard-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install ".[dev]" pyinstaller==6.22.3

      - name: Test
        run: python -m pytest -q

      - name: Build
        run: pyinstaller packaging/focusguard.spec --noconfirm

      # ditto keeps the symlinks inside the Qt frameworks that a plain zip would break.
      - name: Zip app bundle
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/FocusGuard.app dist/FocusGuard-macos.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
